server {
    listen 80;
    server_name cds-smh.duckdns.org 13.124.71.205;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cds-smh.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/cds-smh.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cds-smh.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}